name: Sync volume-viii to monorepo

on:
  push:
    branches: [main]
    paths:
      - 'volume-viii/**'
      - 'bibliography/volume-viii-logic-foundations.bib'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lra-volume-viii
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          repository: wsollers/Learning-Real-Analysis
          token: ${{ secrets.SYNC_PAT }}
          path: monorepo

      - name: Validate volume bibliography
        run: |
          cd source
          python scripts/check_bibliography.py --bib-dir bibliography

      - name: Validate volume
        run: |
          cd source
          python scripts/build_volume.py --validate-only

      - name: Sync volume-viii/ into monorepo
        run: |
          rsync -av --delete source/volume-viii/ monorepo/volume-viii/

      - name: Sync volume-viii bibliography into monorepo
        run: |
          mkdir -p monorepo/bibliography
          cp source/bibliography/volume-viii-logic-foundations.bib monorepo/bibliography/volume-viii-logic-foundations.bib

      - name: Commit and push if changed
        run: |
          cd monorepo
          git config user.name  "lra-sync-bot"
          git config user.email "sync-bot@noreply.github.com"
          git add volume-viii/ bibliography/volume-viii-logic-foundations.bib
          git diff --cached --quiet && echo "No changes to sync" && exit 0
          git commit -m "chore: sync volume-viii from lra-volume-viii"
          git push
